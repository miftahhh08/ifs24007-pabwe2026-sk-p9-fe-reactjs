server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Teruskan API ke backend Golang.
  # GANTI https://URL-BACKEND-KAMU dengan alamat backend yang sudah online.
  location /api/ {
    proxy_pass https://URL-BACKEND-KAMU;
    proxy_ssl_server_name on;
    proxy_set_header Host URL-BACKEND-KAMU;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;   # AI generator bisa lambat
  }

  # SPA: semua rute (/login, /author, /posts/...) kembali ke index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
